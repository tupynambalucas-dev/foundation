name: GitHub Apps Declarative Lifecycle Sync

on:
  pull_request:
    paths:
      - "identity/apps/github/**"
      - ".github/workflows/app-lifecycle-sync.yml"
  push:
    branches:
      - main
    paths:
      - "identity/apps/github/**"
      - ".github/workflows/app-lifecycle-sync.yml"
  workflow_dispatch:
    inputs:
      reconcile_webhooks:
        description: "Run programmatic PATCH /app/hook/config webhook reconciliation"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-lifecycle-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-audit:
    name: Validate Manifests & Audit GitHub App Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Foundation Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate Declarative GitHub App Manifests (JSON Schema & Zero-Emoji)
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const base = path.resolve("identity/apps/github");
            const tiers = fs
              .readdirSync(base, { withFileTypes: true })
              .filter((e) => e.isDirectory() && fs.existsSync(path.join(base, e.name, "manifest.json")))
              .map((e) => e.name)
              .sort();
            if (tiers.length === 0) throw new Error("No GitHub App manifests discovered");
            const emojiRe = /[\u{1F300}-\u{1F5FF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1F1E0}-\u{1F1FF}]/u;
            for (const tier of tiers) {
              const p = path.join(base, tier, "manifest.json");
              const descPath = path.join(base, tier, "description.md");
              if (!fs.existsSync(descPath)) {
                throw new Error(`Missing required description.md in ${path.join(base, tier)}`);
              }
              const raw = fs.readFileSync(p, "utf8");
              const descRaw = fs.readFileSync(descPath, "utf8");
              if (emojiRe.test(raw) || emojiRe.test(descRaw)) throw new Error(`Emoji detected in ${tier}`);
              const parsed = JSON.parse(raw);
              const gh = parsed.provider === "github" && parsed.github ? parsed.github : parsed;
              if (!gh.name || !gh.url || !gh.default_permissions) {
                throw new Error(`Missing required manifest fields in ${p}`);
              }
              if (gh.name.endsWith("-bot")) {
                throw new Error(`Forbidden -bot suffix in ${p}: ${gh.name}`);
              }
              console.log(`[OK] ${tier}: ${gh.name} (${Object.keys(gh.default_permissions).length} permissions)`);
            }
          '

      - name: Checkout Agent Mesh Drift Auditor
        if: ${{ vars.ENABLE_LIVE_APP_AUDIT == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tupynambalucas-dev/agent-mesh
          path: .agent-mesh

      - name: Run Live Drift Audit & Optional Webhook Reconciliation
        if: ${{ vars.ENABLE_LIVE_APP_AUDIT == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          ORG_MANAGER_APP_ID: ${{ secrets.ORG_MANAGER_APP_ID }}
          ORG_MANAGER_APP_INSTALLATION_ID: ${{ secrets.ORG_MANAGER_APP_INSTALLATION_ID }}
          ORG_MANAGER_APP_PRIVATE_KEY_BASE64: ${{ secrets.ORG_MANAGER_APP_PRIVATE_KEY_BASE64 }}
          AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
          AUTOMATION_APP_INSTALLATION_ID: ${{ secrets.AUTOMATION_APP_INSTALLATION_ID }}
          AUTOMATION_APP_PRIVATE_KEY_BASE64: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY_BASE64 }}
          GUARDIAN_APP_ID: ${{ secrets.GUARDIAN_APP_ID }}
          GUARDIAN_APP_INSTALLATION_ID: ${{ secrets.GUARDIAN_APP_INSTALLATION_ID }}
          GUARDIAN_APP_PRIVATE_KEY_BASE64: ${{ secrets.GUARDIAN_APP_PRIVATE_KEY_BASE64 }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ inputs.reconcile_webhooks }}" = "true" ]; then
            node .agent-mesh/plugins/packages/github-org/skills/github-app-operator/scripts/audit-apps.js --reconcile-webhooks
          else
            node .agent-mesh/plugins/packages/github-org/skills/github-app-operator/scripts/audit-apps.js
          fi
