name: ci
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monorepo-quality:
    name: Turborepo Quality & Lint Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm Environment
        uses: ./.github/actions/setup-pnpm-env
        with:
          node-version: "22"
          pnpm-version: "12.6.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  cli-test:
    name: CLI Multi-Platform Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: extensions/gh-tl
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -v ./...

      - name: Build tl CLI binary
        run: go build -v ./cmd/tl

  distros-verify:
    name: WSL2 Distro Manifests & Scripts Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate JSON schemas (DistributionInfo.json & Terminal Profiles)
        run: |
          jq empty distributions/catalog/DistributionInfo.json
          jq empty distributions/base/assets/terminal-profile.json
          jq empty distributions/cluster/assets/terminal-profile.json

      - name: Run ShellCheck on WSL OOBE and Systemd Masking Scripts
        run: |
          shellcheck distributions/shared/oobe-common.sh \
                     distributions/shared/systemd-mask.sh \
                     distributions/base/etc/oobe.sh \
                     distributions/cluster/etc/oobe.sh
