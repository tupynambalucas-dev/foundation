name: ci
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-test:
    name: CLI Build & Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Run go vet across cli bounded context
        run: go vet ./cli/...

      - name: Run unit tests across cli bounded context
        run: go test -v ./cli/...

      - name: Build tl CLI binary
        run: go build -v ./cli/cmd/tl

  distros-verify:
    name: WSL2 Distro Manifests & Scripts Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate JSON schemas (DistributionInfo.json & Terminal Profiles)
        run: |
          jq empty distros/catalog/DistributionInfo.json
          jq empty distros/base/assets/terminal-profile.json
          jq empty distros/cluster/assets/terminal-profile.json

      - name: Run ShellCheck on WSL OOBE and Systemd Masking Scripts
        run: |
          shellcheck distros/shared/oobe-common.sh \
                     distros/shared/systemd-mask.sh \
                     distros/base/etc/oobe.sh \
                     distros/cluster/etc/oobe.sh
