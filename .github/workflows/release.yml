name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-lint:
    name: Release Gate: Verification & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm Environment
        uses: ./.github/actions/setup-pnpm-env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turborepo lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Run Go tests
        working-directory: tools/github/extensions/gh-tl
        run: |
          go vet ./...
          go test -race ./...

      - name: Validate distribution manifests and scripts
        run: |
          jq empty distributions/catalog/DistributionInfo.json
          jq empty distributions/base/assets/terminal-profile.json
          jq empty distributions/cluster/assets/terminal-profile.json
          shellcheck distributions/shared/oobe-common.sh \
                     distributions/shared/systemd-mask.sh \
                     distributions/base/etc/oobe.sh \
                     distributions/cluster/etc/oobe.sh

  build-and-package:
    name: Build Binaries, Packages & Generate Release Notes
    needs: test-and-lint
    runs-on: ubuntu-latest
    outputs:
      release-notes: ${{ steps.notes.outputs.body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Base Image & Package Rootfs
        id: pkg-base
        uses: ./.github/actions/package-wsl-distro
        with:
          distro-name: "tupynambalucas-dev"
          dockerfile-path: "distributions/base/Dockerfile"
          output-dir: "output"

      - name: Build Cluster Image & Package Rootfs
        id: pkg-cluster
        uses: ./.github/actions/package-wsl-distro
        with:
          distro-name: "tupynambalucas-dev-cluster"
          dockerfile-path: "distributions/cluster/Dockerfile"
          build-args: "--build-arg BASE_IMAGE=tupynambalucas-dev-base:latest"
          output-dir: "output"

      - name: Stamp DistributionInfo.json with SHA-256 Hashes
        run: |
          BASE_SHA="${{ steps.pkg-base.outputs.sha256-digest }}"
          CLUSTER_SHA="${{ steps.pkg-cluster.outputs.sha256-digest }}"
          jq --arg base_sha "$BASE_SHA" --arg cluster_sha "$CLUSTER_SHA" \
            '.ModernDistributions["tupynambalucas-dev"][0].Amd64Url.Sha256 = $base_sha |
             .ModernDistributions["tupynambalucas-dev-cluster"][0].Amd64Url.Sha256 = $cluster_sha' \
            distributions/catalog/DistributionInfo.json > output/DistributionInfo.json
          cp virtualization/registry/tupynambalucas-dev.reg output/tupynambalucas-dev.reg

      - name: Generate Release Notes via git-cliff
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: output/RELEASE_NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append Cryptographic SHA-256 Integrity Matrix
        id: notes
        run: |
          BASE_SHA="${{ steps.pkg-base.outputs.sha256-digest }}"
          CLUSTER_SHA="${{ steps.pkg-cluster.outputs.sha256-digest }}"
          cat << 'EOF' >> output/RELEASE_NOTES.md

          ---

          ### Cryptographic Artifact Digest Matrix (SHA-256)

          | Artifact Asset | Cryptographic Digest (0x prefix) |
          | :--- | :--- |
          | `tupynambalucas-dev.wsl` | `'$BASE_SHA'` |
          | `tupynambalucas-dev-cluster.wsl` | `'$CLUSTER_SHA'` |

          ---

          ### Host Installation & Automated Onboarding Runbook

          ```powershell
          # 1. Install or update the GitHub CLI extension
          gh extension install tupynambalucas-dev/workstation

          # 2. Automated Host Day-0 Governance (Registry, .wslconfig & Terminal Staging)
          gh tl host prepare

          # 3. Stream & Initialize Sovereign WSL2 Developer Instance
          gh tl distro install tupynambalucas-dev
          ```
          EOF

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: distribution-artifacts
          path: output/
          retention-days: 1

  publish-release:
    name: Atomic Release Publication & Asset Upload
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Distribution Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: distribution-artifacts
          path: output/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            output/tupynambalucas-dev.wsl \
            output/tupynambalucas-dev-cluster.wsl \
            output/DistributionInfo.json \
            output/tupynambalucas-dev.reg \
            --title "${GITHUB_REF_NAME}" \
            --notes-file output/RELEASE_NOTES.md \
            --verify-tag
