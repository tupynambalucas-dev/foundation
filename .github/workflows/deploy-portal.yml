name: Deploy Identity Portal to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "identity/portal/**"
      - "identity/apps/**"
      - ".github/workflows/deploy-portal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup-pnpm-env

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Core & Web Frontend (React + Vite)
        run: |
          pnpm --filter @tupynambalucas-dev/identity-portal-core build
          pnpm --filter @tupynambalucas-dev/identity-portal-web build

      - name: Test & Typecheck Edge Worker API
        run: |
          pnpm --filter @tupynambalucas-dev/identity-portal-api test
          pnpm --filter @tupynambalucas-dev/identity-portal-api typecheck

      - name: Deploy Portal via Wrangler Action
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "identity/portal/api"
          packageManager: "pnpm"
          command: deploy
