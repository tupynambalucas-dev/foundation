# lefthook.yml - tupynambalucas-dev/foundation
# Authoritative Git Hook Configuration (Evil Martians Lefthook)

pre-commit:
  parallel: true
  commands:
    go-lint:
      root: "tools/github/extensions/gh-tl/"
      glob: "*.go"
      run: golangci-lint run ./...
    
    go-test:
      root: "tools/github/extensions/gh-tl/"
      glob: "*.go"
      run: go test -race ./...

    shellcheck:
      glob: "*.{sh,bash}"
      run: shellcheck {staged_files}

    markdownlint:
      glob: "*.md"
      run: npx markdownlint-cli2 {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  commands:
    prevent-main-push:
      run: |
        BRANCH=$(git branch --show-current)
        if [ "$BRANCH" = "main" ]; then
          echo "[ERROR] Direct push to main branch is strictly blocked."
          exit 1
        fi
