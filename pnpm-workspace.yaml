catalogMode: 'strict'
shellEmulator: true

peerDependencyRules:
  allowAny:
    - eslint

allowBuilds:
  'esbuild': true

packages:
  - 'distributions'
  - 'tools/github/extensions/*'
  - 'virtualization'

catalog:
  '@types/node': ^26.6.2
  'typescript': ^6.0.3
  'tsx': ^4.23.15
  'rimraf': '^6.1.3'
  'turbo': 2.11.5

catalogs:
  tooling-stack:
    '@eslint/js': '10.0.1'
    '@typescript-eslint/eslint-plugin': 8.70.1
    'eslint': 10.11.0
    'eslint-config-prettier': '^10.1.8'
    'eslint-plugin-prettier': '^5.5.6'
    'prettier': 3.9.9
    'typescript-eslint': 8.70.1

  plugins-stack:
    '@tupynambalucas-dev/agent-mesh': 'github:tupynambalucas-dev/agent-mesh'
